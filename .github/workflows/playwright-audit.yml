name: Playwright Health & QA Audit

on:
  schedule:
    # Runs every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  playwright-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run 24/7 Automated Health Monitor
        run: node scripts/monitor_health.js
        env:
          TEST_URL: 'https://trendpulse-live.web.app'

      - name: Run E2E Test Suite
        run: npm run test:e2e
        env:
          TEST_URL: 'https://trendpulse-live.web.app'
