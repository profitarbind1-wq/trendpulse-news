name: Auto Update Worldwide News, Deploy & Post to Telegram

on:
  schedule:
    # Runs every 2 hours automatically 24/7 (00:00, 02:00, 04:00, 06:00, etc. UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ingest Worldwide Trending News & Post to Telegram
        run: |
          python auto_updater.py

      - name: Commit & Push Updated News Cache & Social Logs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "TrendPulse Auto Bot"
          git add data/news.json data/cricket.json data/deals.json data/posted_articles.json sitemap.xml robots.txt rss.xml
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update worldwide trending news & social logs [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No new changes to commit."
          fi

      - name: Deploy to Firebase Hosting
        if: env.FIREBASE_TOKEN != ''
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
